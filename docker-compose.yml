# Optional: run against Postgres instead of the default SQLite file.
#   docker compose up -d
#   set DATABASE_URL=postgresql+psycopg2://gotham:gotham@localhost:5432/gotham
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gotham
      POSTGRES_PASSWORD: gotham
      POSTGRES_DB: gotham
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
